[package]
name = "procmon"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "procmon"
path = "src/lib.rs"

[[bin]]
name = "procmon"
path = "src/main.rs"

[dependencies]
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
